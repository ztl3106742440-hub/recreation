<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Recreation · 小游戏合集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1c2e 0%, #2d1b3d 50%, #1a1c2e 100%);
    color: #e8e6f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }
  h1 {
    font-size: clamp(28px, 6vw, 42px);
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ffd86b, #ff9a4d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { opacity: 0.6; margin-bottom: 40px; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 900px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s, border-color 0.2s, background 0.2s;
    display: block;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: #ffd86b;
    background: rgba(255,216,107,0.08);
  }
  .card h2 { font-size: 20px; margin-bottom: 8px; }
  .card p { opacity: 0.7; font-size: 14px; line-height: 1.5; }
  .badge {
    display: inline-block;
    background: rgba(255,216,107,0.2);
    color: #ffd86b;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    margin-bottom: 12px;
  }
  footer { margin-top: 60px; opacity: 0.4; font-size: 12px; }
  footer a { color: inherit; }
</style>
</head>
<body>
  <h1>🎮 Recreation</h1>
  <p class="sub">闲来无事写点小游戏</p>
  <div class="grid">
    <a class="card" href="./coin-tavern/">
      <div class="badge">桌面 / 移动端</div>
      <h2>🪙 Coin Tavern</h2>
      <p>抛硬币的小酒馆，点开即玩。</p>
    </a>
  </div>
  <footer>
    <a href="https://github.com/ztl3106742440-hub/recreation" target="_blank">GitHub Repo</a>
  </footer>
</body>
</html>
